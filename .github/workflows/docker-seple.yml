name: Build & Push Seple Docker Images

# Called by ci.yml only — like every other lane in this repo, this workflow
# has no push/pull_request trigger of its own. Adding one would build every
# image twice on a push to main (once here, once via the orchestrator).
#
# On a PR the images are built but NOT pushed (no registry write, no AWS
# creds). On a push to main the images are pushed to ECR — the registry the
# deployed ECS task definitions actually pull from. The ECS *redeploy* is a
# separate, gated job in ci.yml (`deploy`) that only runs after every check
# passes, so a red build never reaches the running services.
on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            service: agent
          - dockerfile: Dockerfile.api
            service: api
          - dockerfile: Dockerfile.scanner
            service: scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assume the AWS OIDC deploy role (main only)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Only pushes to main authenticate + publish. PR builds stay local so a
      # pull request can never write to ECR or touch AWS.
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Vite bakes this at build time; without it the dashboard queries the
          # viewer's localhost:8000. Only the agent Dockerfile consumes it;
          # api/scanner ignore the unused arg.
          build-args: |
            VITE_TENDER_API_URL=https://api.seple.in
          tags: |
            ${{ secrets.AWS_ECR_REGISTRY }}/seple-tender-prod-${{ matrix.service }}:latest
            ${{ secrets.AWS_ECR_REGISTRY }}/seple-tender-prod-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
