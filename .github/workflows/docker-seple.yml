name: Build & Push Seple Docker Images

# Called by ci.yml only — like every other lane in this repo, this workflow
# has no push/pull_request trigger of its own. Adding one would build every
# image twice on a push to main (once here, once via the orchestrator).
on:
  workflow_call:

jobs:
  build:
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            service: agent
          - dockerfile: Dockerfile.api
            service: api
          - dockerfile: Dockerfile.scanner
            service: scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR rejects uppercase image paths and this owner is "Itinerant18",
      # so lowercase it instead of interpolating the owner into the tag.
      - name: Compute image base
        id: img
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "base=ghcr.io/${owner}/seple-tender" >> "$GITHUB_OUTPUT"

      # Only pushes to main publish. PR builds stay local so a pull request
      # can never write to the registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.img.outputs.base }}-${{ matrix.service }}:latest
            ${{ steps.img.outputs.base }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
