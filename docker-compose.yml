# SEPLE Tender Intelligence Platform
# Docker Compose — ties all services together


services:
  # ─── PostgreSQL Database ─────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Tender API (FastAPI) ────────────────────────────────
  tender-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/tenders
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  # ─── Tender Scanner (Scheduler + Scrapers) ───────────────
  tender-scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/tenders
      TENDER_TIGER_EMAIL: ${TENDER_TIGER_EMAIL}
      TENDER_TIGER_PASSWORD: ${TENDER_TIGER_PASSWORD}
      TENDER247_EMAIL: ${TENDER247_EMAIL}
      TENDER247_PASSWORD: ${TENDER247_PASSWORD}
      SCAN_HOUR: ${SCAN_HOUR:-6}
      SCAN_MINUTE: ${SCAN_MINUTE:-0}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      # persist TenderTiger browser session across rebuilds — fresh logins trip the WAF
      - seple_sessions:/root/.seple

  # ─── Hermes Agent ────────────────────────────────────────
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Run the gateway daemon (stays up under s6 + runs the cron scheduler).
    # Bare `hermes` is interactive and exits with no TTY → crash-loop.
    command: gateway run
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # tender_mcp/server.py reads this to reach the pipeline REST API
      TENDER_API_URL: http://tender-api:8000
      # Built-in web chat UI (talk to the agent in a browser). Auth gate is
      # mandatory on non-loopback binds — set the two vars below in .env.
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      # Stable session signing key — without it every login dies on restart.
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      # Scoped account (role: tender_user) — Tenders + Chat only.
      HERMES_DASHBOARD_TENDER_USERNAME: ${HERMES_DASHBOARD_TENDER_USERNAME:-}
      HERMES_DASHBOARD_TENDER_PASSWORD: ${HERMES_DASHBOARD_TENDER_PASSWORD:-}
    ports:
      - "9119:9119"   # Hermes web chat dashboard
    depends_on:
      - tender-api
    env_file:
      - .env
    volumes:
      # persist config.yaml (incl. registered MCP servers), memory, auth
      - hermes_data:/opt/data

volumes:
  pgdata:
  seple_sessions:
  hermes_data:
