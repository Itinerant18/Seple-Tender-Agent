# SEPLE Tender Intelligence Platform
# Docker Compose — ties all services together

version: "3.8"

services:
  # ─── PostgreSQL Database ─────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Tender API (FastAPI) ────────────────────────────────
  tender-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/tenders
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  # ─── Tender Scanner (Scheduler + Scrapers) ───────────────
  tender-scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-changeme}@db:5432/tenders
      TENDER_TIGER_EMAIL: ${TENDER_TIGER_EMAIL}
      TENDER_TIGER_PASSWORD: ${TENDER_TIGER_PASSWORD}
      TENDER247_EMAIL: ${TENDER247_EMAIL}
      TENDER247_PASSWORD: ${TENDER247_PASSWORD}
      SCAN_HOUR: ${SCAN_HOUR:-6}
      SCAN_MINUTE: ${SCAN_MINUTE:-0}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  # ─── Hermes Agent ────────────────────────────────────────
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TENDER_API_URL: http://tender-api:8000
    depends_on:
      - tender-api
    env_file:
      - .env

volumes:
  pgdata:
