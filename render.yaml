version: "1"

databases:
  - name: tenders-db
    plan: free
    region: singapore

services:
  - type: web
    name: tender-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash scripts/render/build-tender.sh
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.playwright
      - key: DATABASE_URL
        fromDatabase:
          name: tenders-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

  - type: cron
    name: tender-scanner
    runtime: python
    plan: starter
    region: singapore
    schedule: "30 0 * * *"
    buildCommand: bash scripts/render/build-tender.sh
    startCommand: python -m scheduler.run_once
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.playwright
      - key: DATABASE_URL
        fromDatabase:
          name: tenders-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: CONTEXT_DEV_API_KEY
        sync: false
      - key: ZYTE_API_KEY
        sync: false
      - key: TENDER_TIGER_EMAIL
        sync: false
      - key: TENDER_TIGER_PASSWORD
        sync: false
      - key: TENDER247_EMAIL
        sync: false
      - key: TENDER247_PASSWORD
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: RECIPIENT_EMAILS
        sync: false

  - type: web
    name: hermes-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: bash scripts/render/build-hermes.sh
    startCommand: python -m hermes_cli.main dashboard --host 0.0.0.0 --port $PORT --no-open --skip-build
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: HERMES_HOME
        value: /opt/render/project/.hermes
      - key: OPENAI_API_KEY
        sync: false
      - key: TENDER_API_URL
        fromService:
          type: web
          name: tender-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_TENDER_API_URL
        fromService:
          type: web
          name: tender-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        sync: false
      - key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        sync: false
      - key: HERMES_DASHBOARD_BASIC_AUTH_SECRET
        generateValue: true
      - key: HERMES_DASHBOARD_TENDER_USERNAME
        sync: false
      - key: HERMES_DASHBOARD_TENDER_PASSWORD
        sync: false
